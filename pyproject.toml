[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "halligan"
version = "0.1.9"
description = "Automated guardrail testing for AI assistants — fire adversarial probe suites at any model and fail the build when a guardrail moves."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Foxxception LLC" }]
maintainers = [{ name = "Jeremy Foxx" }]
keywords = ["ai", "llm", "safety", "guardrails", "red-team", "evaluation", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  # Pinned, not floated. CI ran ruff format --check with whatever was newest
  # while pre-commit pinned v0.8.4, and 0.16 joins implicitly-concatenated
  # strings that 0.8 left alone — so the local hook passed and CI failed on
  # a file the hook had just approved. Bump this and the pre-commit rev in
  # the same commit.
  "ruff==0.16.3",
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://halligan.dev"
Source = "https://github.com/mobius29er/halligan"
Issues = "https://github.com/mobius29er/halligan/issues"

[project.scripts]
halligan = "halligan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/halligan"]

# `pip install halligan` used to give you a CLI and nothing to point it at.
# The suites ship inside the wheel so `halligan init` can write them out.
# Mapped to the same relative layout the repo uses, so one resolver handles
# both a wheel and a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"suites" = "halligan/_bundled/suites"
"data/names.yaml" = "halligan/_bundled/data/names.yaml"
"policies/general.md" = "halligan/_bundled/policies/general.md"
"policies/catholic.md" = "halligan/_bundled/policies/catholic.md"
"packs" = "halligan/_bundled/packs"
"Truthly/target.example.yaml" = "halligan/_bundled/Truthly/target.example.yaml"

# An explicit allowlist, not an exclude list: hatchling otherwise sweeps in
# everything git tracks, and the 0.1.0 sdist shipped at 37 MB because of it.
# A new directory in the repo root should not be able to reach PyPI by default.
[tool.hatch.build.targets.sdist]
include = [
  "src/halligan",
  "tests",
  "suites",
  "data",
  "docs",
  "policies",
  "packs",
  "Truthly",
  "README.md",
  "LICENSE",
  "NOTICE",
  "TRADEMARKS.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# tests/test_grader_accuracy.py imports tests.fixtures.roleplay_corpus, which
# only resolves when the repo root is on sys.path. `python -m pytest` puts it
# there implicitly; the bare `pytest` CI runs does not, so the suite passed
# locally and failed on every runner. Make pytest do it regardless of how it
# is invoked.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

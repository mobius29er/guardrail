name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — a key committed and reverted is still leaked

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Unit tests
        run: pytest -q

      # No API keys needed: this only parses the YAML and checks grader names.
      - name: Validate shipped suites
        run: guardrail validate --suite suites/

  # Optional live run against a real model. Skipped unless ANTHROPIC_API_KEY is
  # configured as a repository secret, so forks and PRs are unaffected.
  live:
    name: Live probe run
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Run suites
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY not configured — skipping live run."
            exit 0
          fi
          cp Truthly/target.example.yaml target.yaml
          guardrail run --target target.yaml --suite suites/ \
            --report report.html --json results.json --no-transcripts

      - name: Upload report
        if: always() && hashFiles('report.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-report
          path: |
            report.html
            results.json
          retention-days: 14
